<g font-size="12" fill="#9aa8c7">
<text x="30" y="390">Permitido: LAN → web DMZ (80, 443) · LAN y DMZ → Internet (80, 443; la DMZ solo el servidor) · VPN → LAN.</text>
<text x="30" y="412">Bloqueado: DMZ → LAN · LAN → resto de la DMZ · DMZ → resto de Internet · VPN → DMZ.</text>
<text x="30" y="434">Tres redes virtuales de Hyper-V: Default Switch (WAN), LAN-lab y DMZ-lab (privadas).</text>
</g>
