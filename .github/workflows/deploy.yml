name: Publicar presentación en AWS

# Se ejecuta al subir cambios de la presentación a la rama main.
# También se puede lanzar a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
    paths:
      - "01 Presentacion/Presentacion Alberto Cuesta.html"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Necesario para pedir el permiso temporal a AWS (OIDC)
permissions:
  id-token: write
  contents: read

# Evita dos publicaciones a la vez
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Conectar con AWS (OIDC, sin claves)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      # Plan B (usuario IAM con claves): borra el paso de arriba y usa este.
      # - name: Conectar con AWS (claves)
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: eu-west-1

      # La ruta local lleva espacios, por eso va entre comillas.
      # En S3 el archivo se llama con guiones: es el objeto raíz de CloudFront.
      - name: Subir la presentación a S3
        run: |
          aws s3 cp "01 Presentacion/Presentacion Alberto Cuesta.html" \
            "s3://${{ secrets.S3_BUCKET }}/Presentacion-Alberto-Cuesta.html" \
            --content-type "text/html; charset=utf-8"

      - name: Vaciar caché de CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
